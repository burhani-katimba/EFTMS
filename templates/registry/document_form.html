{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-2xl px-4 py-8">
    <a href="{% url 'registry_dashboard' %}" class="mb-4 inline-flex items-center gap-1 text-sm text-[#0067c0] hover:underline">
        <i data-lucide="arrow-left" class="h-4 w-4"></i> Back to dashboard
    </a>
    <h1 class="mb-6 text-2xl font-semibold text-black">Register Document</h1>
    <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
            <div>
                <label class="mb-1 block text-sm font-semibold text-[#424242]" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.help_text %}<p class="mt-0.5 text-xs text-[#5c5c5c]">{{ field.help_text }}</p>{% endif %}
                {% if field.errors %}<p class="mt-1 text-sm text-[#c43e1c]">{{ field.errors|striptags }}</p>{% endif %}
            </div>
        {% endfor %}
        <div class="flex items-center gap-3 pt-4">
            <button class="rounded-md bg-[#0067c0] px-4 py-2 text-sm font-semibold text-white hover:bg-[#005a9e]" type="submit">Register Document</button>
            <a class="rounded-md border border-[#c8c8c8] bg-white px-4 py-2 text-sm font-semibold text-[#424242] hover:bg-[#f7f7f7]" href="{% url 'registry_dashboard' %}">Cancel</a>
        </div>
    </form>
</div>
<style>
    input, select, textarea { width: 100%; border-radius: 0.375rem; border: 1px solid #c8c8c8; padding: 0.5rem 0.75rem; font-size: 0.875rem; }
    input:focus, select:focus, textarea:focus { border-color: #0067c0; outline: none; }
    textarea { resize: vertical; }
</style>
{% endblock %}
