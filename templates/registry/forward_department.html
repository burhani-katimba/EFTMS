{% extends "base.html" %}
{% block content %}
<div class="mx-auto max-w-lg px-4 py-8">
    <a href="{% url 'registry_dashboard' %}" class="mb-4 inline-flex items-center gap-1 text-sm text-[#0067c0] hover:underline">
        <i data-lucide="arrow-left" class="h-4 w-4"></i> Back
    </a>
    <div class="rounded-xl border border-[#e7e7e7] bg-white p-6 shadow-sm">
        <h1 class="mb-2 text-xl font-semibold text-black">Forward to Department</h1>
        <p class="mb-1 text-sm text-[#5c5c5c]">{{ doc.document_id }} — {{ doc.title }}</p>
        <p class="mb-6 text-xs text-[#5c5c5c]">Current holder: <span class="font-semibold">{{ doc.current_holder }}</span></p>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="mb-1 block text-sm font-semibold text-[#424242]" for="department">Department</label>
                <select name="department" id="department" class="w-full rounded-md border border-[#c8c8c8] px-3 py-2 text-sm focus:border-[#0067c0] focus:outline-none" required>
                    <option value="">Select Department</option>
                    {% for dept in departments %}
                    <option value="{{ dept.id }}" {% if doc.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="mb-1 block text-sm font-semibold text-[#424242]" for="comment">Comment (optional)</label>
                <textarea name="comment" id="comment" rows="3" class="w-full rounded-md border border-[#c8c8c8] px-3 py-2 text-sm focus:border-[#0067c0] focus:outline-none"></textarea>
            </div>
            <div class="flex items-center gap-3 pt-2">
                <button class="rounded-md bg-[#0067c0] px-4 py-2 text-sm font-semibold text-white hover:bg-[#005a9e]" type="submit">
                    <i data-lucide="send" class="inline h-4 w-4"></i> Forward
                </button>
                <a class="rounded-md border border-[#c8c8c8] bg-white px-4 py-2 text-sm font-semibold text-[#424242] hover:bg-[#f7f7f7]" href="{% url 'registry_dashboard' %}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
